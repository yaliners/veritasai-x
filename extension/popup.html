<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VeritasShield AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hdr">
      <div class="logo"><span class="dot"></span></div>
      <div>
        <p class="brand">VeritasShield AI</p>
        <p class="ver">v1.0.0 · SOC Edge</p>
      </div>
      <span class="live">LIVE</span>
    </header>

    <section class="site">
      <p class="lbl">CURRENT SITE</p>
      <p id="domain" class="dom">—</p>
      <div class="rbox" id="riskBox">
        <span id="riskBadge" class="badge">SCANNING</span>
      </div>
    </section>

    <section class="scores">
      <div class="score"><p class="slbl">Threat</p><p id="threat" class="sval danger">0</p></div>
      <div class="score"><p class="slbl">Trust</p><p id="trust" class="sval success">0</p></div>
      <div class="score"><p class="slbl">AI Conf</p><p id="conf" class="sval cyan">0%</p></div>
    </section>

    <section class="stats-bar">
      <div class="stat-box">
        <p class="stat-val" id="totalScanned">0</p>
        <p class="stat-lbl">Scanned</p>
      </div>
      <div class="stat-box">
        <p class="stat-val danger" id="threatsBlocked">0</p>
        <p class="stat-lbl">Blocked</p>
      </div>
      <div class="stat-box">
        <p class="stat-val success" id="safeSites">0</p>
        <p class="stat-lbl">Safe</p>
      </div>
    </section>

    <section class="modules">
      <p class="lbl">DETECTION MODULES</p>
      <ul id="modules"></ul>
    </section>

    <section class="xai">
      <p class="lbl">AI EXPLANATION</p>
      <ul id="reasons"></ul>
    </section>

    <div style="display: flex; gap: 8px; padding: 12px 0;">
      <button id="reportDangerous" style="width: 50%; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; background: rgba(239,68,68,0.15); border: 1px solid #EF4444; color: #EF4444; cursor: pointer;">🚨 Report Dangerous</button>
      <button id="reportSafe" style="width: 50%; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; background: rgba(34,197,94,0.15); border: 1px solid #22C55E; color: #22C55E; cursor: pointer;">✅ Report Safe</button>
    </div>
    <p style="color: var(--text-muted); font-size: 11px; text-align: center; margin-top: -4px; margin-bottom: 12px;">Your reports help improve detection accuracy</p>

    <button id="openDash" class="cta">Open Dashboard ↗</button>
    <script src="popup.js"></script>
  </body>
</html>
